name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json' # Cambia tu-subcarpeta

      - name: Install dependencies
        run: npm install
        working-directory: ./web  # Cambia tu-subcarpeta

      - name: Build Next.js app
        run: npm run build
        working-directory: ./web  # Cambia tu-subcarpeta

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out # Cambia tu-subcarpeta

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4